# Mantém o repositório atualizado automaticamente (PRs semanais agrupados).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      tooling:
        patterns: ['*']
        exclude-patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
  - package-ecosystem: composer
    directory: /api
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
