name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck:e2e
      - run: npx ng test --watch=false
      - run: npm run build

  api:
    name: API — PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, mbstring
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: vendor/bin/phpunit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-junit
          path: api/var/junit.xml
          if-no-files-found: ignore

  playwright:
    name: Playwright — API, contrato e E2E (MySQL)
    needs: [frontend, api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tarefas
          MYSQL_USER: tarefas
          MYSQL_PASSWORD: tarefas_ci
          MYSQL_ROOT_PASSWORD: root_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: 'true'
      DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=tarefas
      DB_USER: tarefas
      DB_PASSWORD: tarefas_ci
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-dev
        working-directory: api
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
